# Diagnostic configuration fragment for bench debugging over RTT/SWD.
# Catches faults early and cleanly instead of escalating to CPU lockup,
# and flushes every log message immediately so the last messages before a
# sudden reset are not lost in the deferred logging buffer.
# Immediate mode logging distorts timing; do not use for release builds.
#
# usage:
#   west build --board sks_airspy --no-sysbuild <app dir> -- -DEXTRA_CONF_FILE=debug.conf

## logging: immediate mode, larger RTT up-buffer
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

## fault diagnostics
# enable runtime asserts (e.g. ANT profile TX error checks)
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
# MPU-based stack overflow detection: fault at the moment of overflow,
# with an intact stack for the fault handler, instead of a later lockup
CONFIG_HW_STACK_PROTECTION=y
# check stack sentinel on context switch as a fallback
CONFIG_STACK_SENTINEL=y
# thread names in fault dumps
CONFIG_THREAD_NAME=y
# halt on fatal error (default CONFIG_RESET_ON_FATAL_ERROR=n already set in
# prj.conf); fault dump goes to RTT
